spring.application.name=cybertrace
server.port=8080

# File Upload configuration (Support up to 10MB CSV logs)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Static resource serving (Serves index.html and all static assets from /static)
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**
