<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CyberTrace — Forensic Time Machine</title>
  <link rel="icon" type="image/png" href="images/logo.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-wrapper">
  <div id="sidebar-container"></div>

  <div class="main-content">
    <div id="navbar-container"></div>

    <main class="container-fluid p-4 p-lg-5 max-w-7xl">
      
      <!-- Empty State -->
      <div id="timeline-empty-state" class="d-none">
        <div class="cyber-card text-center py-5">
          <i class="bi bi-clock-history text-slate-500 fs-1 mb-2"></i>
          <h4 class="text-white fw-bold mb-2">No Timeline Telemetry</h4>
          <p class="text-slate-400 small mb-4">Upload a log file to reconstruct the chronological attack timeline.</p>
          <a href="upload.html" class="btn btn-primary btn-sm px-3 py-2">Go to Upload</a>
        </div>
      </div>

      <!-- Timeline Content -->
      <div id="timeline-content" class="d-none">
        <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">
          <div>
            <h2 class="text-white fw-bold m-0">Forensic Time Machine</h2>
            <p class="text-slate-400 small m-0">Interactive chronological playback engine isolating initial infiltration and lateral progression.</p>
          </div>
        </div>

        <!-- Playback Controller Bar -->
        <div class="cyber-card mb-4 p-3">
          <div class="d-flex flex-wrap align-items-center justify-content-between gap-3">
            <div class="d-flex align-items-center gap-2">
              <button id="timeline-prev-btn" class="btn btn-outline-secondary btn-sm px-3" title="Previous Event">
                <i class="bi bi-chevron-left"></i> Previous
              </button>
              <button id="timeline-play-btn" class="btn btn-info btn-sm px-3 text-dark fw-bold">
                <i class="bi bi-play-fill"></i> Play
              </button>
              <button id="timeline-next-btn" class="btn btn-outline-secondary btn-sm px-3" title="Next Event">
                Next <i class="bi bi-chevron-right"></i>
              </button>
            </div>

            <div class="flex-grow-1 mx-md-4" style="min-width: 180px;">
              <input type="range" class="form-range" id="timeline-slider" min="0" max="0" value="0">
            </div>

            <span class="badge bg-dark border border-secondary text-cyan font-mono px-3 py-2" id="timeline-step-label">
              Event 1 of 1
            </span>
          </div>
        </div>

        <!-- Main Timeline Workspace: Left is Event List, Right is Selected Detail Pane -->
        <div class="row g-4">
          <!-- Timeline Steps List -->
          <div class="col-12 col-lg-5">
            <div class="cyber-card p-3" style="max-height: 520px; overflow-y: auto;">
              <h6 class="text-slate-400 small text-uppercase fw-bold mb-3 d-flex align-items-center gap-1.5">
                <i class="bi bi-list-nested text-cyan"></i> Chronological Sequence
              </h6>
              <div id="timeline-items-container">
                <!-- Injected via timeline.js -->
              </div>
            </div>
          </div>

          <!-- Selected Event Detail Pane -->
          <div class="col-12 col-lg-7">
            <div id="timeline-detail-pane">
              <!-- Injected via timeline.js -->
            </div>
          </div>
        </div>

      </div>

    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/storage.js"></script>
<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script src="js/timeline.js"></script>
</body>
</html>
